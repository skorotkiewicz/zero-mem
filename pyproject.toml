[project]
name = "pi-zero-mem-nlp"
version = "0.1.0"
description = "spaCy and BGE-M3 runtime for pi-zero-mem"
requires-python = ">=3.10,<3.14"
dependencies = [
  "sentence-transformers>=5,<6",
  "spacy>=3.8,<4",
  "torch>=2.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
